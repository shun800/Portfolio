  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg viewBox='0 0 40 48' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 48 C12 38 0 28 0 16 C0 7 5 0 13 0 C16 0 18.5 2 20 5 C21.5 2 24 0 27 0 C35 0 40 7 40 16 C40 28 28 38 20 48Z' fill='%23E8A0B0'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ページ遷移オーバーレイ -->
  <div class="page-transition-overlay" id="page-transition"></div>

  <!-- ヘッダー -->
  <header class="header" id="header">
    <a href="index.html" class="header-logo">Shun Arai</a>
    <nav class="header-nav">
      <a href="index.html">HOME</a>
      <a href="about.html">ABOUT</a>
      <a href="works.html">WORKS</a>
      <a href="appeal.html">APPEAL</a>
    </nav>
    <a href="contact.html" class="header-cta-petal" aria-label="お問い合わせ">
      <svg viewBox="0 0 50 44" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="letter-clip">
            <path d="M0,0 L50,0 L50,25 L46.5,25 L25,40.5 L3.5,25 L0,25Z"/>
          </clipPath>
        </defs>
        <rect x="3" y="16" width="44" height="26" rx="3" fill="#FEE8EF" stroke="#E8A0B0" stroke-width="1.2"/>
        <path class="env-fold" d="M3.5,16.5 L25,34 L46.5,16.5" fill="none" stroke="#E8A0B0" stroke-width="0.8" stroke-linejoin="round"/>
        <path class="env-flap-open" d="M3.5,16.5 L46.5,16.5 L25,1Z" fill="#F8D0DC" stroke="#E8A0B0" stroke-width="1" stroke-linejoin="round"/>
        <g class="env-letter" clip-path="url(#letter-clip)">
          <rect x="9" y="16" width="32" height="120" rx="2" fill="#fff" stroke="#E8A0B0" stroke-width="0.8"/>
          <line x1="14" y1="22" x2="36" y2="22" stroke="#E8A0B0" stroke-width="0.5" opacity="0.5"/>
          <line x1="14" y1="27" x2="36" y2="27" stroke="#E8A0B0" stroke-width="0.5" opacity="0.5"/>
          <line x1="14" y1="32" x2="32" y2="32" stroke="#E8A0B0" stroke-width="0.5" opacity="0.5"/>
        </g>
        <path class="env-outline" d="M3.5,16.5 L46.5,16.5 L25,32Z" fill="none" stroke="#E8A0B0" stroke-width="1" stroke-linejoin="round"/>
        <path class="env-flap" d="M3.5,16.5 L46.5,16.5 L25,32Z" fill="#F8D0DC" stroke="#E8A0B0" stroke-width="1" stroke-linejoin="round"/>
      </svg>
    </a>
    <button class="hamburger" id="hamburger" aria-label="メニューを開く">
      <span></span><span></span><span></span>
    </button>
  </header>

  <div class="sp-menu" id="sp-menu">
    <button class="sp-menu-close" id="sp-menu-close" aria-label="メニューを閉じる">&times;</button>
    <a href="index.html">HOME</a>
    <a href="about.html">ABOUT</a>
    <a href="works.html">WORKS</a>
    <a href="appeal.html">APPEAL</a>
    <a href="contact.html" class="is-active">CONTACT</a>
  </div>

  <!-- ヒーロー -->
  <section class="hero hero--medium bg-section" id="hero">
    <div class="sakura-container" data-petals="25"></div>

    <!-- シンプルテキスト構成 -->
    <div style="display:flex;flex-direction:column;align-items:center;z-index:2;">
      <!-- 小さな花びら -->
      <svg class="contact-petal-mini" viewBox="0 0 40 48" xmlns="http://www.w3.org/2000/svg" style="width:32px;height:38px;margin-bottom:12px;">
        <path d="M20 48 C12 38 0 28 0 16 C0 7 5 0 13 0 C16 0 18.5 2 20 5 C21.5 2 24 0 27 0 C35 0 40 7 40 16 C40 28 28 38 20 48Z" fill="#E8A0B0"/>
      </svg>
      <h1 style="font-family:var(--font-display);font-size:48px;font-weight:400;color:var(--text-main);letter-spacing:0.05em;">CONTACT</h1>
      <p style="font-family:var(--font-serif);font-size:13px;color:var(--mauve);margin-top:8px;">お問い合わせ・ご依頼</p>
    </div>
  </section>

  <!-- フォームセクション -->
  <section class="section bg-off-white" id="contact-form-section">
    <div class="container--narrow">
      <!-- 連絡先情報 -->
      <div style="text-align:center;margin-bottom:40px;" class="fade-in">
        <p style="font-size:13px;color:var(--text-muted);">Email：shun8019@icloud.com</p>
        <p style="font-size:12px;color:var(--mauve);margin-top:4px;">3営業日以内にご返信いたします</p>
      </div>

      <!-- フォーム -->
      <form id="contact-form" class="fade-in" novalidate style="max-width:600px;margin:0 auto;">
        <!-- お名前 -->
        <div class="form-group">
          <label class="form-label" for="name">お名前 <span class="form-required">必須</span></label>
          <input type="text" id="name" class="form-input" placeholder="例：山田 太郎" required>
          <p class="form-error"></p>
        </div>

        <!-- メールアドレス -->
        <div class="form-group">
          <label class="form-label" for="email">メールアドレス <span class="form-required">必須</span></label>
          <input type="email" id="email" class="form-input" placeholder="例：example@email.com" required>
          <p class="form-error"></p>
        </div>

        <!-- 電話番号 -->
        <div class="form-group">
          <label class="form-label" for="tel">電話番号 <span class="form-required">必須</span></label>
          <input type="tel" id="tel" class="form-input" placeholder="例：090-1234-5678" required>
          <p class="form-error"></p>
        </div>

        <!-- お問い合わせ種別 -->
        <div class="form-group">
          <label class="form-label" for="type">お問い合わせ種別 <span class="form-required">必須</span></label>
          <select id="type" class="form-select" required>
            <option value="">選択してください</option>
            <option value="制作依頼">サイト制作のご依頼</option>
            <option value="見積もり">お見積もり・ご相談</option>
            <option value="その他">その他</option>
          </select>
          <p class="form-error"></p>
        </div>

        <!-- メッセージ -->
        <div class="form-group">
          <label class="form-label" for="message">メッセージ <span class="form-required">必須</span></label>
          <textarea id="message" class="form-textarea" rows="5" placeholder="ご相談の内容をお書きください" required></textarea>
          <p class="form-error"></p>
        </div>

        <!-- 送信ボタン -->
        <button type="submit" class="btn-primary">送信する</button>
      </form>
    </div>
  </section>

  <!-- 送信完了ダイアログ -->
  <div class="dialog-overlay" id="dialog-overlay">
    <div class="dialog">
      <h3 class="dialog-title">お問い合わせありがとうございます</h3>
      <p class="dialog-text">3営業日以内にご連絡いたします。</p>
      <button class="dialog-close" onclick="closeDialog()">閉じる</button>
    </div>
  </div>

  <!-- フッター -->
  <footer class="footer">
    <p class="footer-logo">Shun Arai</p>
    <nav class="footer-nav">
      <a href="index.html">HOME</a>
      <a href="about.html">ABOUT</a>
      <a href="works.html">WORKS</a>
      <a href="appeal.html">APPEAL</a>
      <a href="contact.html">CONTACT</a>
    </nav>
    <p class="footer-privacy"><a href="privacy.html">プライバシーポリシー</a></p>
    <p class="footer-copy">&copy; 2025 Shun Arai. All Rights Reserved.</p>
  </footer>

  <a href="contact.html" class="sp-fixed-cta">お問い合わせ</a>
  <script src="script.js"></script>
  <script>
    // contact.html専用：フォームバリデーション初期化
    document.addEventListener('DOMContentLoaded', initContactForm);
  </script>
</body>
</html>
